name: Keep Insight Hub awake for the daily run

# Render's free plan puts the service to sleep after ~15 minutes without traffic, and a sleeping service cannot start its
# daily procurement run. This wakes it shortly before the run (default 10:17 UTC) and keeps it awake for about an hour
# while the run works. Not needed once the service is on a paid always-on plan; delete this file then.
#
# Override the address with the repository variable INSIGHT_HUB_URL if the service URL ever changes.

on:
  schedule:
    - cron: "10,20,30,40,50 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-insight-hub-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping the service (waits through a cold start)
        env:
          INSIGHT_HUB_URL: ${{ vars.INSIGHT_HUB_URL || 'https://insight-hub-952b.onrender.com' }}
        run: |
          set -u
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 150 "${INSIGHT_HUB_URL%/}/" || echo "000")
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "${code}" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::warning::Insight Hub did not answer with HTTP 200 after 3 attempts"
          exit 1
