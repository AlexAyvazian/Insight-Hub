openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: Occu-Med Insight Hub API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: opportunities
    description: Opportunity management
  - name: settings
    description: Application settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /opportunities:
    get:
      operationId: listOpportunities
      tags: [opportunities]
      summary: List opportunities
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [active, archived, all]
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: naicsCode
          schema:
            type: string
        - in: query
          name: agency
          schema:
            type: string
        - in: query
          name: source
          schema:
            type: string
            description: Filter by provider name (e.g. sam_gov, serper, exa, tango, bidnet)
        - in: query
          name: dateRange
          schema:
            type: integer
            description: Only return results posted within this many days (freshness window).
        - in: query
          name: freshOnly
          schema:
            type: boolean
            description: When true, exclude results flagged stale or with an unknown date.
        - in: query
          name: view
          schema:
            type: string
            enum: [actionable, needs-verification, closed, all]
            default: actionable
            description: Derived quality view. Defaults to actionable verified-open opportunities.
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated opportunities list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunitiesResponse"

  /opportunities/fetch:
    post:
      operationId: fetchOpportunities
      tags: [opportunities]
      summary: Fetch from one or more configured sources
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keywords:
                  type: string
                dateRange:
                  type: integer
                  default: 30
                providers:
                  type: array
                  items:
                    type: string
                  description: List of provider names to fetch from. Defaults to all configured providers.
      responses:
        "202":
          description: Persisted manual ingestion run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionRunStarted"
        "409":
          description: Another manual ingestion run is already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: No providers configured or invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /opportunities/ingestion-runs/current:
    get:
      operationId: getCurrentOpportunityIngestionRun
      tags: [opportunities]
      summary: Read the latest persisted manual ingestion run
      responses:
        "200":
          description: Latest run, or null when no run exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    anyOf:
                      - $ref: "#/components/schemas/IngestionRun"
                      - type: "null"

  /opportunities/ingestion-runs:
    get:
      operationId: listOpportunityIngestionRuns
      tags: [opportunities]
      summary: List recent manual ingestion runs
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngestionRun"

  /opportunities/ingestion-runs/{runId}:
    get:
      operationId: getOpportunityIngestionRun
      tags: [opportunities]
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Persisted run and provider progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    $ref: "#/components/schemas/IngestionRun"

  /opportunities/ingestion-runs/{runId}/retry:
    post:
      operationId: retryFailedOpportunityProviders
      tags: [opportunities]
      summary: Start a new manual run containing only failed providers
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Retry run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionRunStarted"
        "409":
          description: Another manual run is active

  /opportunities/reconcile-expired:
    post:
      operationId: reconcileExpiredOpportunities
      tags: [opportunities]
      summary: Explicitly archive active opportunities with known past deadlines
      responses:
        "200":
          description: Reconciliation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  archived:
                    type: integer

  /opportunities/import:
    post:
      operationId: importOpportunitiesFromCsv
      tags: [opportunities]
      summary: Import from CSV
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /opportunities/{id}:
    get:
      operationId: getOpportunity
      tags: [opportunities]
      summary: Get opportunity by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Opportunity detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteOpportunity
      tags: [opportunities]
      summary: Delete an opportunity
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /opportunities/{id}/feedback:
    get:
      operationId: getOpportunityFeedback
      tags: [opportunities]
      summary: Get grade for an opportunity
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Feedback record (null if ungraded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedback:
                    $ref: "#/components/schemas/OpportunityFeedback"
    post:
      operationId: gradeOpportunity
      tags: [opportunities]
      summary: Submit or update a grade for an opportunity
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grade]
              properties:
                grade:
                  type: string
                  enum: [excellent, good, poor, spam]
                notes:
                  type: string
      responses:
        "200":
          description: Grade submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  opportunityId:
                    type: string
                  grade:
                    type: string
        "400":
          description: Invalid grade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Opportunity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /opportunities/feedback/model-summary:
    get:
      operationId: getFeedbackModelSummary
      tags: [opportunities]
      summary: Get the current state of the learning model signal weights
      responses:
        "200":
          description: Model summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelSummary"

  /opportunities/feedback/rescore:
    post:
      operationId: rescoreOpportunities
      tags: [opportunities]
      summary: Trigger a full re-score of all opportunities
      responses:
        "200":
          description: Re-score complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /providers:
    get:
      operationId: listProviders
      tags: [settings]
      summary: Get all provider statuses
      responses:
        "200":
          description: Provider status list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersResponse"

  /providers/{name}:
    put:
      operationId: updateProvider
      tags: [settings]
      summary: Save credentials for a provider
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        "200":
          description: Updated provider status
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  status:
                    $ref: "#/components/schemas/ProviderStatus"
        "404":
          description: Unknown provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Opportunity:
      type: object
      required: [id, title, agency, type, status, postedDate]
      properties:
        id:
          type: string
        noticeId:
          type: string
        title:
          type: string
        agency:
          type: string
        subAgency:
          type: string
        office:
          type: string
        type:
          type: string
        status:
          type: string
          enum: [active, archived]
        naicsCode:
          type: string
        naicsDescription:
          type: string
        pscCode:
          type: string
          description: Product/Service Code or classification code
        contractType:
          type: string
          description: e.g. Fixed-Price, IDIQ, Cost-Plus
        postedDate:
          type: string
          format: date-time
        responseDeadline:
          type: string
          format: date-time
        periodOfPerformance:
          type: string
          description: Duration or period of performance description
        setAside:
          type: string
        placeOfPerformance:
          type: string
        description:
          type: string
        solicitationNumber:
          type: string
        samUrl:
          type: string
        # Financial fields
        estimatedValue:
          type: number
          description: Estimated contract value
        ceilingValue:
          type: number
          description: Contract ceiling value
        floorValue:
          type: number
          description: Contract floor value
        awardAmount:
          type: number
        awardee:
          type: string
        # Source tracking
        source:
          type: string
          enum: [sam_gov, csv_import, manual]
        providerName:
          type: string
          description: Originating provider identifier (sam_gov, serper, exa, tango, bidnet, etc.)
        # Intelligence fields
        relevanceScore:
          type: number
          description: Computed relevance/fit score (0-100)
        sourceConfidence:
          type: string
          enum: [high, medium, low]
          description: Confidence level of the source data
        tags:
          type: array
          items:
            type: string
          description: Quality/category tags (e.g. date-unknown, stale, category name)
        relevance:
          $ref: "#/components/schemas/RelevanceView"
        quality:
          $ref: "#/components/schemas/OpportunityQuality"
        notes:
          type: string
        # Learning model fields
        userConfidence:
          type: number
          description: Model-predicted confidence (0-100) that this opportunity is a good fit, based on your grading history
        userGrade:
          type: string
          enum: [excellent, good, poor, spam]
          nullable: true
          description: Your latest grade for this opportunity (null = ungraded)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


    OpportunityQuality:
      type: object
      required: [classification, label, actionable, summaryEligible, sourceType, reasons, hasFutureDeadline, deadlineKnown, buyerKnown, solicitationLike, sourceVerified, sourceAuthority, evidenceFingerprint]
      properties:
        classification:
          type: string
          enum: [verified-open, needs-verification, closed, archived, award, forecast, discovery-only]
        label:
          type: string
        actionable:
          type: boolean
        summaryEligible:
          type: boolean
        sourceType:
          type: string
          enum: [official-direct, verified-solicitation-page, search-discovery, aggregator, unknown]
        reasons:
          type: array
          items:
            type: string
        hasFutureDeadline:
          type: boolean
        deadlineKnown:
          type: boolean
        buyerKnown:
          type: boolean
        solicitationLike:
          type: boolean
        sourceVerified:
          type: boolean
        sourceAuthority:
          type: string
          enum: [trusted, medium, low]
        evidenceFingerprint:
          type: string

    SummaryIneligibilityReason:
      type: string
      enum: [authoritative_content_unavailable, future_deadline_unverified, discovery_only, record_not_actionable]
    RelevanceView:
      type: object
      description: Transparent relevance summary used by the UI to explain ranking.
      required: [score, reasons, dateUnknown, stale, confidence]
      properties:
        score:
          type: number
          description: Relevance/fit score (0-100)
        reasons:
          type: array
          items:
            type: string
          description: Human-readable reasons this result matched (or was ranked down)
        category:
          type: string
          nullable: true
          description: Primary testing type (most specific Occu-Med service category the record evidences); the UI group key
        testingTypes:
          type: array
          items:
            type: string
          description: Every testing type the record evidences, best first (the primary type is first)
        dateUnknown:
          type: boolean
          description: True when no reliable publication date was detected
        stale:
          type: boolean
          description: True when the result appears to be from a past/historical period
        confidence:
          type: string
          enum: [high, medium, low]
        postedDate:
          type: string
          format: date-time
          nullable: true

    OpportunitiesResponse:
      type: object
      required: [data, total, page, limit, view]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Opportunity"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        view:
          type: string
          enum: [actionable, needs-verification, closed, all]
          description: Selected quality view; total counts this complete view after classification and deduplication.

    IngestionRunStarted:
      type: object
      required: [runId, status, run]
      properties:
        runId:
          type: string
        status:
          type: string
          enum: [queued, running, completed, completed_with_errors, failed]
        run:
          $ref: "#/components/schemas/IngestionRun"

    IngestionRun:
      type: object
      required:
        [
          id,
          status,
          selectedProviders,
          providersCompleted,
          providersTotal,
          fetched,
          staged,
          accepted,
          rejected,
          duplicates,
          created,
          updated,
          archived,
          errors,
          createdAt,
          updatedAt,
          sources,
          providerErrors,
        ]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, completed_with_errors, failed]
        selectedProviders:
          type: array
          items:
            type: string
        query:
          type: string
          nullable: true
        dateRange:
          type: integer
          nullable: true
        retryOfRunId:
          type: string
          nullable: true
        currentProvider:
          type: string
          nullable: true
        providersCompleted:
          type: integer
        providersTotal:
          type: integer
        fetched:
          type: integer
        staged:
          type: integer
        accepted:
          type: integer
        rejected:
          type: integer
        duplicates:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        archived:
          type: integer
        errors:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        sources:
          type: array
          items:
            $ref: "#/components/schemas/IngestionRunSource"
        providerErrors:
          type: array
          items:
            type: object
            properties:
              provider:
                type: string
              error:
                type: string

    IngestionRunSource:
      type: object
      required:
        [
          id,
          runId,
          provider,
          position,
          status,
          fetched,
          staged,
          accepted,
          rejected,
          duplicates,
          created,
          updated,
          updatedAt,
        ]
      properties:
        id:
          type: string
        runId:
          type: string
        provider:
          type: string
        position:
          type: integer
        status:
          type: string
          enum: [queued, running, completed, failed]
        fetched:
          type: integer
        staged:
          type: integer
        accepted:
          type: integer
        rejected:
          type: integer
        duplicates:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        error:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time

    ImportResult:
      type: object
      required: [imported, skipped, errors]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string

    Settings:
      type: object
      properties:
        samApiKeyConfigured:
          type: boolean
        samApiKeyMasked:
          type: string
        dolApiKeyConfigured:
          type: boolean
        dolApiKeyMasked:
          type: string
        courtListenerTokenConfigured:
          type: boolean
        courtListenerTokenMasked:
          type: string
        fecApiKeyConfigured:
          type: boolean
        fecApiKeyMasked:
          type: string
        defaultKeywords:
          type: string
        defaultDateRange:
          type: integer
        organizationName:
          type: string

    SettingsUpdate:
      type: object
      properties:
        samApiKey:
          type: string
        dolApiKey:
          type: string
        courtListenerToken:
          type: string
        fecApiKey:
          type: string
        defaultKeywords:
          type: string
        defaultDateRange:
          type: integer
        organizationName:
          type: string

    ProviderField:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [secret, text, url]
        placeholder:
          type: string
        description:
          type: string
        dbKey:
          type: string

    ProviderStatus:
      type: object
      properties:
        configured:
          type: boolean
        healthy:
          type: boolean
        errorMessage:
          type: string
        recordCount:
          type: integer
        lastAttempt:
          type: string
          format: date-time
        lastSuccess:
          type: string
          format: date-time

    Provider:
      type: object
      required:
        [
          name,
          displayName,
          description,
          category,
          useCase,
          ingestionEligible,
          ingestionMode,
          capabilities,
          requiredFields,
          optionalFields,
          status,
        ]
      properties:
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [primary, ai, search, procurement]
        useCase:
          type: string
          enum: [direct_source, web_discovery, research_analysis, hybrid]
          description: How this provider is used in opportunity intelligence
        ingestionEligible:
          type: boolean
          description: Whether the provider can be selected for a manual RFP ingestion run
        ingestionMode:
          type: string
          enum: [direct, hybrid, discovery, stub]
          description: The provider's actual role in the manual ingestion pipeline
        capabilities:
          type: array
          items:
            type: string
        docsUrl:
          type: string
        signupUrl:
          type: string
        notes:
          type: string
        requiredFields:
          type: array
          items:
            $ref: "#/components/schemas/ProviderField"
        optionalFields:
          type: array
          items:
            $ref: "#/components/schemas/ProviderField"
        status:
          $ref: "#/components/schemas/ProviderStatus"

    ProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/Provider"

    OpportunityFeedback:
      type: object
      properties:
        id:
          type: string
        opportunityId:
          type: string
        grade:
          type: string
          enum: [excellent, good, poor, spam]
        notes:
          type: string
        agency:
          type: string
        naicsCode:
          type: string
        providerName:
          type: string
        tags:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ModelSummarySignal:
      type: object
      properties:
        key:
          type: string
        weight:
          type: number

    ModelSummary:
      type: object
      properties:
        totalGrades:
          type: integer
          description: Total number of graded opportunities
        topAgencies:
          type: array
          items:
            $ref: "#/components/schemas/ModelSummarySignal"
        topNaics:
          type: array
          items:
            $ref: "#/components/schemas/ModelSummarySignal"
        topProviders:
          type: array
          items:
            $ref: "#/components/schemas/ModelSummarySignal"
        topTags:
          type: array
          items:
            $ref: "#/components/schemas/ModelSummarySignal"
        topKeywords:
          type: array
          items:
            $ref: "#/components/schemas/ModelSummarySignal"

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: string
