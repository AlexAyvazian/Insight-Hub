services:
  - type: web
    name: insight-hub
    runtime: node
    region: oregon
    plan: starter
    buildCommand: pnpm install && pnpm run build:prod
    startCommand: pnpm run start:prod
    # Persistent disk for the relevance-profile cache (last-known-good copy of the Neon profile, used only when
    # Neon is unreachable). Render's filesystem is otherwise ephemeral; only files under mountPath survive
    # restarts and deploys. Disks need a paid plan, and prevent zero-downtime deploys and multi-instance scaling.
    disk:
      name: relevance-cache
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: RELEVANCE_PROFILE_CACHE_PATH
        value: /var/data/relevance/occumed-relevance-profile-cache.json
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: BASE_PATH
        value: /
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: UV_THREADPOOL_SIZE
        value: "2"
      - key: RFP_DATABASE_URL
        sync: false
      - key: INTEL_DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "1"
      - key: DATABASE_POOL_IDLE_TIMEOUT_MS
        value: "10000"
      - key: DATABASE_CONNECT_TIMEOUT_MS
        value: "8000"
      - key: PUBLIC_PORTAL_CONCURRENCY
        value: "1"
      - key: PUBLIC_PORTAL_SOURCE_TIMEOUT_MS
        value: "25000"
      - key: PUBLIC_PORTAL_RUN_TIMEOUT_MS
        value: "90000"
      - key: PUBLIC_PORTAL_MAX_PAGES
        value: "3"
      - key: PUBLIC_PORTAL_ROTATION_BATCH_SIZE
        value: "3"
      - key: WEB_INTELLIGENCE_AI_CANDIDATE_LIMIT
        value: "20"
      # Release C: the structured AI review is adaptive (free capacity, rate limits, time budget) and backed by a
      # persistent queue, so there is no fixed per-run ceiling. STRUCTURED_RFP_REVIEW_CANDIDATE_LIMIT is an optional
      # operator override only and is intentionally unset.
      - key: STRUCTURED_RFP_REVIEW_TIME_BUDGET_MS
        value: "35000"
      - key: OPPORTUNITY_REVIEW_QUEUE_ENABLED
        value: "true"
      - key: OPPORTUNITY_REQUIREMENT_LEDGER_ENABLED
        value: "true"
      - key: OPPORTUNITY_COVERAGE_TRACKING_ENABLED
        value: "true"
      # Document pipeline: staged activation (off until enabled on the service after deploy).
      - key: OPPORTUNITY_DOCUMENT_PIPELINE_ENABLED
        value: "false"
      - key: OPPORTUNITY_REQUIRE_DOCUMENT_EVIDENCE
        value: "false"
      - key: DOCUMENT_EXTRACTION_WORKER_MODE
        value: "off"
      # Free-tier document extraction accounts (two LLMWhisperer accounts, Nutrient fallback). Never on a paid plan.
      - key: LLMWHISPERER_API_KEY
        sync: false
      - key: LLMWHISPERER_API_KEY_2
        sync: false
      - key: NUTRIENT_API_KEY
        sync: false
      - key: LINKUP_API_KEY_2
        sync: false
      - key: SAM_GOV_API_KEY
        sync: false
      - key: SAM_GOV_API_KEY_2
        sync: false
      - key: SAM_GOV_CLASSIFICATION_QUERIES_PER_RUN
